# Render Blueprint: runs the DOMEVO server with plain Node (no Docker).
services:
  - type: web
    name: domevo
    runtime: node
    plan: free
    buildCommand: echo "nothing to build"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: 939585bf35fd2c9bc972468f88bf1d01
        sync: false
